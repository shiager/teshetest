<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测测你是哪个特摄角色 · 特摄人格测试</title>
<style>
  :root{
    --bg:#070a14; --card:#12172b; --card2:#1a2138; --line:#2a3556;
    --text:#eaf0ff; --muted:#9aa7c7;
    --red:#ff3b5c; --blue:#22d3ee; --gold:#ffd166; --green:#34d399;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:
      radial-gradient(1000px 500px at 15% -10%, rgba(255,59,92,.22), transparent 60%),
      radial-gradient(900px 500px at 85% 0%, rgba(34,211,238,.18), transparent 60%),
      radial-gradient(700px 600px at 50% 110%, rgba(255,209,102,.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  #app{max-width:760px; margin:0 auto; padding:24px 16px 60px;}
  .screen{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .hidden{display:none!important;}

  .hero{text-align:center; padding:48px 8px 20px;}
  .badge{
    display:inline-block; padding:6px 14px; border:1px solid var(--line);
    border-radius:999px; color:var(--gold); font-size:13px; letter-spacing:2px;
    background:rgba(255,209,102,.08); margin-bottom:20px;
  }
  h1{font-size:42px; line-height:1.2; margin:0 0 14px; letter-spacing:1px;}
  .grad{
    background:linear-gradient(120deg,#ff3b5c,#ffd166 45%,#22d3ee);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{color:var(--muted); font-size:15px; line-height:1.9; margin:0 0 26px;}
  .btn{
    border:0; cursor:pointer; color:#fff; font-weight:700; letter-spacing:1px;
    border-radius:14px; transition:.18s; font-size:17px;
  }
  .btn:active{transform:scale(.97);}
  .btn.main{
    padding:16px 44px; font-size:18px;
    background:linear-gradient(120deg,#ff3b5c,#ff7a5c);
    box-shadow:0 10px 30px rgba(255,59,92,.35);
  }
  .btn.ghost{
    background:var(--card2); color:var(--text); border:1px solid var(--line); padding:12px 22px;
  }
  .btn.small{font-size:13px; padding:8px 14px;}

  /* 作品库选择 */
  .lib-wrap{max-width:600px; margin:0 auto;}
  .lib-head{display:flex; align-items:center; justify-content:space-between; margin:0 0 12px;}
  .lib-head .t{font-size:15px; color:var(--gold); font-weight:800;}
  .lib-head .r{display:flex; gap:8px;}
  .lib-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; text-align:left;}
  .lib-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;
    cursor:pointer; transition:.15s;
  }
  .lib-card:hover{border-color:var(--blue);}
  .lib-card.on{border-color:var(--blue); background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(34,211,238,.05));}
  .lib-card .l-name{font-size:16px; font-weight:800;}
  .lib-card .l-count{font-size:12px; color:var(--muted); margin:4px 0 6px;}
  .lib-card .l-check{font-size:12px; color:var(--green); opacity:0; font-weight:700;}
  .lib-card.on .l-check{opacity:1;}
  .pool-note{text-align:center; color:var(--muted); font-size:13px; margin:16px 0 0;}
  .pool-note b{color:var(--gold);}

  .tips{margin-top:34px; color:var(--muted); font-size:13px; text-align:center; line-height:1.8;}

  /* 测试页 */
  .quiz .bar{height:8px; background:#1a2138; border-radius:99px; overflow:hidden; margin:12px 0 20px;}
  .quiz .fill{height:100%; background:linear-gradient(90deg,#22d3ee,#34d399); border-radius:99px; transition:width .25s;}
  .meta{color:var(--muted); font-size:13px; margin-bottom:14px; display:flex; justify-content:space-between;}
  .dim{color:var(--gold);}
  .quiz h2{font-size:22px; line-height:1.6; margin:6px 0 6px; font-weight:800;}
  .quiz .lead{color:var(--muted); font-size:13px; margin-bottom:22px;}
  .opts{display:grid; gap:12px;}
  .opt{
    text-align:left; width:100%; padding:16px 16px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    color:var(--text); font-size:16px; line-height:1.6; transition:.15s;
  }
  .opt:hover{border-color:var(--blue); transform:translateY(-2px);}
  .opt.sel{border-color:var(--blue); background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(34,211,238,.05));}
  .opt b{color:var(--blue); margin-right:8px;}
  .nav{display:flex; justify-content:space-between; margin-top:22px;}

  /* 结果页 */
  .result-top{text-align:center; margin:16px 0 24px;}
  .type-big{
    font-size:38px; font-weight:900; letter-spacing:1px; margin:8px 0 4px;
    background:linear-gradient(120deg,#ffd166,#ff3b5c); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .type-desc{color:var(--muted); font-size:14px; line-height:1.9; max-width:560px; margin:12px auto 0;}

  .hero-card{
    background:linear-gradient(160deg,#1c2440,#12172b); border:1px solid var(--line);
    border-radius:22px; padding:26px; margin:22px 0;
    box-shadow:0 18px 50px rgba(0,0,0,.45); position:relative; overflow:hidden;
  }
  .hero-card::before{
    content:""; position:absolute; inset:-1px; border-radius:22px; padding:1px;
    background:linear-gradient(120deg,#ff3b5c,#ffd166,#22d3ee);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:.7; pointer-events:none;
  }
  .hc-title{font-size:13px; color:var(--gold); letter-spacing:3px; margin-bottom:10px;}
  .hc-name{font-size:34px; font-weight:900; margin:0 0 4px;}
  .hc-work{color:var(--blue); font-size:15px; margin-bottom:16px;}
  .hc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; font-size:14px; color:#cdd7f2;}
  .hc-grid .k{color:var(--muted); margin-right:6px;}
  .hc-p{grid-column:1/-1; line-height:1.8; color:#dbe4ff; background:rgba(255,255,255,.04); border-radius:12px; padding:12px 14px; margin-top:4px;}

  .section-title{font-size:20px; font-weight:800; margin:30px 0 14px; display:flex; align-items:center; gap:10px;}
  .section-title::before{content:""; width:8px; height:22px; border-radius:4px; background:linear-gradient(#ff3b5c,#ffd166);}
  .why{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 20px; line-height:2; color:#dbe4ff; font-size:15px;
  }
  .bars{margin:16px 0;}
  .bar-row{display:grid; grid-template-columns:120px 1fr 72px; align-items:center; gap:10px; margin:10px 0; font-size:13px;}
  .bar-row .lb{color:var(--muted); text-align:right;}
  .bar-row .v{color:var(--gold); font-weight:700;}
  .bar-track{height:8px; background:#1a2138; border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,#22d3ee,#34d399);}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .mini-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;}
  .mini-card .m-name{font-size:18px; font-weight:800;}
  .mini-card .m-work{color:var(--blue); font-size:13px; margin:4px 0 8px;}
  .mini-card .m-type{font-size:12px; color:var(--gold);}
  .mini-card .m-reason{font-size:13px; color:var(--muted); line-height:1.7; margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}
  .actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:32px;}
  .count-note{text-align:center; color:var(--muted); font-size:12px; margin-top:26px;}
</style>
</head>

/* ================= 工具函数 ================= */
function clamp(v){return Math.max(0,Math.min(100,v));}
function jitter(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return (h%13)-6;}
function charVec(c){
  const b=TYPES[c.t].b.slice();
  if(c.x){b[0]=c.x[0]; b[4]=c.x[1]; b[6]=c.x[2];}
  else{const d=jitter(c.n); b[0]=clamp(b[0]+d); b[4]=clamp(b[4]+d); b[6]=clamp(b[6]+d);}
  return b;
}
function dist(a,b){let s=0;for(let i=0;i<7;i++){const d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);}

/* ================= 状态 ================= */
const app=document.getElementById("app");

  let pool=[];
  for(const id in LIBS){
    if(state.libs[id]) pool=pool.concat(LIBS[id].chars);
  }
  return pool;
}
function toggleLib(id){
  state.libs[id]=!state.libs[id];
  render();
}
function allLibs(val){
  for(const id in LIBS) state.libs[id]=val;
  render();
}
function start(){
  if(getPool().length===0){ alert("请至少选择一个作品库！"); return; }
  state.screen="quiz";

  const qi=state.order[state.q];
  state.answers[qi]=i;

  else showResult();
}

  if(state.q>0){state.q--; render();}
}

/* ================= 计分 ================= */
const SCORE=[2,1,-1,-2];
function compute(){
  const sum={};
  Q.forEach((q,i)=>{
    const v=state.answers[i];
    if(v!==undefined) sum[q.t]=(sum[q.t]||0)+SCORE[v];
  });
  const vec=TRAIT_KEYS.map(k=>{
    const s=sum[k]||0;
    return Math.round((s+12)/24*100);
  });
  const letters=(vec[1]>=50?"E":"I")+(vec[5]>=50?"N":"S")+(vec[2]>=50?"F":"T")+(vec[3]>=50?"J":"P");
  return {vec,letters};
}

/* ================= 解析文案 ================= */
function mainReason(vec,cv,T){
  const same=[],close=[];
  for(let i=0;i<7;i++){
    const u=vec[i],c=cv[i];
    if(u>=55&&c>=55) same.push("你们都非常「"+TRAIT_NAMES[i][0]+"」");
    else if(u<=45&&c<=45) same.push("你们都非常「"+TRAIT_NAMES[i][1]+"」");
    else if(Math.abs(u-c)<=10) close.push("你们在「"+TRAIT_NAMES[i][0]+"·"+TRAIT_NAMES[i][1]+"」上高度接近");
  }
  let parts=same.slice(0,2);
  if(parts.length<3) parts=parts.concat(close.slice(0,3-parts.length));
  return "你与TA同属「"+T.n+"」人格类型。"+(parts.length?parts.join("；")+"。":"")+T.d;
}
function reasonFor(vec,cv,mode){
  if(mode==="like"){
    let best=0,bd=1e9;
    for(let i=0;i<7;i++){const d=Math.abs(vec[i]-cv[i]);if(d<bd){bd=d;best=i;}}
    return "在「"+TRAIT_NAMES[best][0]+"·"+TRAIT_NAMES[best][1]+"」上高度一致";
  }else{
    let best=0,bd=-1;
    for(let i=0;i<7;i++){const d=Math.abs(vec[i]-cv[i]);if(d>bd){bd=d;best=i;}}
    return "在「"+TRAIT_NAMES[best][0]+"·"+TRAIT_NAMES[best][1]+"」上与你截然相反";
  }
}

/* ================= 结果 ================= */
function showResult(){
  const {vec,letters}=compute();
  const T=TYPES[letters];
  const pool=getPool();
  const sameType=pool.filter(c=>c.t===letters);
  const cands=sameType.length?sameType:pool;
  let main=null,bd=1e9;
  cands.forEach(c=>{const d=dist(vec,charVec(c));if(d<bd){bd=d;main=c;}});
  const mv=charVec(main);

  const others=pool.filter(c=>c!==main).map(c=>({c,d:dist(vec,charVec(c))})).sort((a,b)=>a.d-b.d);
  const similar=others.slice(0,Math.min(3,others.length));
  const opposite=others.slice(-Math.min(3,others.length)).reverse();

  state.screen="result";
  renderResult(main,mv,vec,letters,similar,opposite,pool.length);
}

  let bars="";
  for(let i=0;i<7;i++){
    const p=vec[i];
    const side=p>=50?TRAIT_NAMES[i][0]:TRAIT_NAMES[i][1];
    bars+='<div class="bar-row"><div class="lb">'+TRAIT_NAMES[i][0]+"·"+TRAIT_NAMES[i][1]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div><div class="v">'+side+" "+p+'</div></div>';
  }

  let simCards="";
  similar.forEach(o=>{
    simCards+='<div class="mini-card"><div class="m-name">'+o.c.n+'</div><div class="m-work">'+o.c.w+'</div><div class="m-type">'+TYPES[o.c.t].n+'</div><div class="m-reason">'+reasonFor(vec,charVec(o.c),"like")+'</div></div>';
  });
  let oppCards="";
  opposite.forEach(o=>{
    oppCards+='<div class="mini-card"><div class="m-name">'+o.c.n+'</div><div class="m-work">'+o.c.w+'</div><div class="m-type">'+TYPES[o.c.t].n+'</div><div class="m-reason">'+reasonFor(vec,charVec(o.c),"opp")+'</div></div>';
  });

  app.innerHTML=
  '<div class="screen">'+
    '<div class="result-top">'+
      '<div class="badge">你的特摄人格</div>'+
      '<div class="type-big">'+T.n+'</div>'+
      '<div class="type-desc">'+T.d+'</div>'+
    '</div>'+

    '<div class="hero-card">'+
      '<div class="hc-title">最像你的特摄角色</div>'+
      '<div class="hc-name">'+main.n+'</div>'+
      '<div class="hc-work">《'+main.w+'》</div>'+
      '<div class="hc-grid">'+
        '<div><span class="k">年龄</span>'+main.a+'</div>'+
        '<div><span class="k">人格</span>'+TYPES[main.t].n+'</div>'+
        '<div class="hc-p"><span class="k">身份</span>'+main.i+'</div>'+
        '<div class="hc-p"><span class="k">性格</span>'+main.p+'</div>'+
      '</div>'+
    '</div>'+

    '<div class="section-title">为什么你和 '+main.n+' 相似</div>'+
    '<div class="why">'+mainReason(vec,mv,T)+'</div>'+

    '<div class="section-title">你的七维特质</div>'+
    '<div class="bars">'+bars+'</div>'+

    '<div class="section-title">相似角色</div>'+
    '<div class="cards">'+(simCards||'<div class="count-note">所选作品库角色不足，无法生成相似角色</div>')+'</div>'+

    '<div class="section-title">相对角色（与你最不同）</div>'+
    '<div class="cards">'+(oppCards||'<div class="count-note">所选作品库角色不足，无法生成相对角色</div>')+'</div>'+

    '<div class="actions">'+
      '<button class="btn main" onclick="shareResult(\''+shareText.replace(/'/g,"")+'\')">复制结果</button>'+
      '<button class="btn ghost" onclick="start()">重新测试</button>'+
    '</div>'+
    '<div class="count-note">本测试含 '+Q.length+' 道题 · 本次从所选作品库 '+poolSize+' 位角色中抽取 · 数据仅供娱乐</div>'+
  '</div>';
  window.scrollTo({top:0});
}

function shareResult(text){
  const done=()=>alert("已复制到剪贴板！\n\n"+text);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,()=>{prompt("复制以下内容：",text);});
  }else{
    prompt("复制以下内容：",text);
  }
}

/* ================= 渲染 ================= */
function libCardsHTML(){
  let s="";
  for(const id in LIBS){
    const lib=LIBS[id];
    const on=state.libs[id];
    s+='<div class="lib-card'+(on?' on':'')+'" onclick="toggleLib(\''+id+'\')">'+
       '<div class="l-name">'+lib.name+'</div>'+
       '<div class="l-count">'+lib.chars.length+' 位角色</div>'+
       '<div class="l-check">'+(on?'✓ 已选择':'点击选择')+'</div>'+
       '</div>';
  }
  return s;
}

function render(){
  if(state.screen==="start"){
    const poolSize=getPool().length;
    app.innerHTML=
    '<div class="screen">'+
      '<div class="hero">'+
        '<div class="badge">特摄人格测试 · TOKUSATSU PERSONALITY</div>'+
        '<h1>测测你是<br><span class="grad">哪个特摄角色</span></h1>'+
        '<p class="sub">'+Q.length+' 道情景选择题 · 类 MBTI 人格测试 · 7 维特摄特质<br>先选择作品库，结果将从你选择的作品库中抽取</p>'+
      '</div>'+
      '<div class="lib-wrap">'+
        '<div class="lib-head">'+
          '<div class="t">选择作品库</div>'+
          '<div class="r">'+
            '<button class="btn ghost small" onclick="allLibs(true)">全选</button>'+
            '<button class="btn ghost small" onclick="allLibs(false)">清空</button>'+
          '</div>'+
        '</div>'+
        '<div class="lib-cards">'+libCardsHTML()+'</div>'+
        '<div class="pool-note">当前将从 <b>'+poolSize+'</b> 位角色中匹配你的特摄人格</div>'+
      '</div>'+
      '<div class="tips" style="margin-top:26px;">'+
        '<button class="btn main" onclick="start()">开始变身测试</button>'+
      '</div>'+
      '<div class="tips">点击作品库卡片即可选择或取消 · 至少选择一个才能开始</div>'+
    '</div>';
  }else if(state.screen==="quiz"){
    const qi=state.order[state.q];
    const q=Q[qi];
    const done=Object.keys(state.answers).length;
    const pct=Math.round(done/Q.length*100);
    const sel=state.answers[qi];
    app.innerHTML=
    '<div class="screen quiz">'+
      '<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '<div class="meta"><span>第 '+(state.q+1)+' / '+Q.length+' 题</span><span class="dim">维度：'+TRAIT_NAMES[TRAIT_KEYS.indexOf(q.t)][0]+' vs '+TRAIT_NAMES[TRAIT_KEYS.indexOf(q.t)][1]+'</span></div>'+
      '<h2>'+q.q+'</h2>'+
      '<div class="lead">你会怎么做？</div>'+
      '<div class="opts">'+
        q.o.map((txt,idx)=>'<button class="opt'+(sel===idx?' sel':'')+'" onclick="answer('+idx+')"><b>'+String.fromCharCode(65+idx)+'</b>'+txt+'</button>').join('')+
      '</div>'+
      '<div class="nav">'+
        '<button class="btn ghost" onclick="prev()">上一题</button>'+
        '<button class="btn ghost" onclick="start()">重新开始</button>'+
      '</div>'+
    '</div>';
  }
}

render();
</script>
</body>
</html>
